[project]
name = "api-customer-refund-system"
version = "0.1.0"
description = "Policy-consistent, AI-assisted refund decisions behind a tenant-scoped API"
readme = "README.md"
authors = [
    { name = "Adewale", email = "webmasterjdd@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=0.69.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "fastapi-mail>=1.6.8",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
api-customer-refund-system = "api_customer_refund_system.main:run"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# DTZ011: date.today() is intentional throughout - refund policy windows are
# calendar-day comparisons (return_window_days), not timezone-sensitive instants.
ignore = ["DTZ011"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
